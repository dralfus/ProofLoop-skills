name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить manifest и runtime-файлы
        run: python scripts/validate_plugin.py plugins/agentic-development-workflow
      - name: Проверить Qwen delivery extension
        run: python scripts/validate_plugin.py --qwen-extension-root .
      - name: Проверить lifecycle fixture
        run: python -m unittest tests/test_validate_plugin.py
