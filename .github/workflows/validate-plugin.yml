name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить manifest и runtime-файлы
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("plugins/agentic-development-workflow")
          manifest = json.loads((root / ".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          assert manifest["name"] == "agentic-development-workflow"
          assert manifest["version"].startswith("1.3.1")
          assert manifest["skills"] == "./skills/"
          runtime = root / "skills/finish-ticket"
          assert (runtime / "SKILL.md").is_file()
          protocol = runtime / "references/task-lifecycle.md"
          assert protocol.is_file()
          assert "Версия workflow: `1.3`" in protocol.read_text(encoding="utf-8")
